# Reviewer rotation for kentaro-m/auto-assign-action (see
# .github/workflows/auto-assign.yml). Runs on every opened / ready PR.
#
# STRATEGY: random sampling with equal probability (the action picks via
# random sample, so load evens out across PRs) + the PR author is always
# excluded from their own review pool. There is no stateful round-robin
# in the action; do not expect strict alternation, expect fair share.
#
# TODO(maintainers): replace the placeholders below with the real GitHub
# handles of the backend maintainers, keeping one handle per line.
# (Completed 2026-10-13: official 6-handle roster is active below.)

# Set to true to add reviewers to pull requests
addReviewers: true

# Set to true to also add the same people as assignees (kept off:
# author-assignment is handled by GitHub itself)
addAssignees: false

# Backend maintainers rotation pool (official team handles).
# A list of reviewers to be added to pull requests (GitHub user names)
reviewers:
  - Asma-Elhadiedy
  - AhmedShaabanAl-Saidi
  - alialtir
  - abdo6894
  - Aya-Selim
  - Esraa-Bakkar

# Reviewers per PR. 2 gives every PR double coverage while keeping each
# maintainer's share at ~2/6 of PRs. Set to 1 for lighter review load,
# or 0 to request all maintainers (not recommended with 6 people).
numberOfReviewers: 2

# PRs with these words in the title are skipped (e.g. early drafts).
skipKeywords:
  - wip
  - draft
