name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore TalebElm.slnx

    - name: Build
      run: dotnet build TalebElm.slnx --no-restore

    - name: Test
      run: dotnet test TalebElm.slnx --no-build --verbosity normal
