name: Security & Vulnerability Scan

# PRs get a dependency diff review; the weekly run re-audits the full
# dependency tree so newly disclosed CVEs are caught even without new PRs.
on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: # allow manual re-runs from the Actions tab

permissions:
  contents: read

jobs:
  # Fails the PR when it introduces dependencies with HIGH or CRITICAL
  # known vulnerabilities (GitHub Advisory Database). Requires the
  # repository dependency graph (Settings -> Security) to be enabled.
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Dependency Review (fail on high/critical)
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # Full-tree NuGet audit (direct + transitive) on every run, including
  # the weekly schedule where there is no PR diff to review.
  nuget-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore TalebElm.slnx

      - name: Audit NuGet packages for vulnerabilities
        run: |
          OUTPUT=$(dotnet list TalebElm.slnx package --vulnerable --include-transitive)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "has the following vulnerable packages"; then
            echo "::error::Vulnerable NuGet packages detected. Run 'dotnet list TalebElm.slnx package --vulnerable --include-transitive' locally, upgrade the affected packages, and re-run."
            exit 1
          fi
          echo "No vulnerable NuGet packages detected."
