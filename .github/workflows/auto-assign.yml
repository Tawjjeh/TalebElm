name: Assign pull requests
on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
jobs:
  assign:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            if ((pr.assignees || []).length > 0) { core.info('already assigned'); return; }
            const res = await github.rest.repos.getContent({
              owner, repo, path: '.github/maintainers.json',
              ref: context.payload.repository.default_branch
            });
            const cfg = JSON.parse(Buffer.from(res.data.content, 'base64').toString());
            const lower = (s) => s.toLowerCase();
            const author = lower(pr.user.login);
            const never = new Set(cfg.neverAssign.map(lower));
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner, repo, pull_number: pr.number, per_page: 100
            });
            const labels = (pr.labels || []).map((l) => l.name);
            const sensitive = [
              /^src\/TalebElm\.Infrastructure\/Migrations\//,
              /^src\/TalebElm\.Infrastructure\/Persistence\//,
              /UnitOfWork/i, /AppDbContext/i,
              /(^|\/)(Auth|Authentication|Authorization|Identity|Jwt|Security)[^\/]*(\/|\.cs$)/i,
              /(PasswordHasher|JwtToken|TokenService|AccessToken|OAuth|Cors|RateLimit|Verifier|Verification|Grading)/i,
              /(^|\/)appsettings.*\.json$/i,
              /^\.github\/workflows\//,
              /\.csproj$/i,
              /(^|\/)(Directory\.Build\.(props|targets)|Directory\.Packages\.props|NuGet\.config|global\.json)$/i
            ];
            const isSensitive = labels.some((l) => ['security', 'database'].includes(l)) ||
              files.some((f) => sensitive.some((rx) => rx.test(f.filename)));
            const pool = (isSensitive ? cfg.core : cfg.regular)
              .filter((l) => lower(l) !== author && !never.has(lower(l)));
            if (pool.length === 0) { core.warning('no eligible assignee'); return; }
            const loads = [];
            for (const login of pool) {
              const r = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:pr is:open assignee:${login}`, per_page: 1
              });
              loads.push({ login, n: r.data.total_count });
            }
            const min = Math.min(...loads.map((x) => x.n));
            const tied = loads.filter((x) => x.n === min);
            const pick = tied[pr.number % tied.length].login;
            await github.rest.issues.addAssignees({ owner, repo, issue_number: pr.number, assignees: [pick] });
            try {
              await github.rest.pulls.requestReviewers({ owner, repo, pull_number: pr.number, reviewers: [pick] });
            } catch (e) { core.warning(String(e.message)); }
