name: Auto-assign reviewer

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  assign:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Assign reviewer via Round-Robin
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;

            // Skip if reviewers are already requested.
            if ((pr.requested_reviewers || []).length > 0) {
              core.info('PR already has requested reviewers; skipping.');
              return;
            }

            const res = await github.rest.repos.getContent({
              owner,
              repo,
              path: '.github/maintainers.json',
              ref: context.payload.repository.default_branch,
            });
            const cfg = JSON.parse(Buffer.from(res.data.content, 'base64').toString('utf8'));

            const lower = (s) => s.toLowerCase();
            const author = lower(pr.user.login);
            const never = new Set((cfg.neverAssign || []).map(lower));

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            const labels = (pr.labels || []).map((l) => lower(l.name));

            const dbOrSecurityPatterns = [
              /(^|\/)(Data|Migrations|Persistence|Configurations|Repositories|Entities)\//i,
              /DbContext/i,
              /\.sql$/i,
              /(^|\/)(Auth|Authentication|Authorization|Security|Identity|Jwt|Policies|Policy)[^/]*(\/|\.cs$)/i,
              /(PasswordHasher|JwtToken|TokenService|AccessToken|OAuth|RateLimit)/i,
            ];

            const isDatabaseOrSecurity =
              labels.some((l) => l === 'database' || l === 'security') ||
              files.some((f) => dbOrSecurityPatterns.some((rx) => rx.test(f.filename)));

            // Database/Security rotates 1-by-1 between core (Abdulrahman and Abdullah);
            // everything else rotates 1-by-1 among regular maintainers.
            const rawPool = isDatabaseOrSecurity ? (cfg.core || []) : (cfg.regular || []);
            const pool = rawPool.filter((u) => lower(u) !== author && !never.has(lower(u)));

            if (pool.length === 0) {
              core.warning('No eligible reviewers available.');
              return;
            }

            // Pick the maintainer with the fewest currently open review requests, breaking ties by PR number.
            const loads = [];
            for (const login of pool) {
              const search = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:pr is:open review-requested:${login}`,
                per_page: 1,
              });
              loads.push({ login, count: search.data.total_count });
            }

            const minCount = Math.min(...loads.map((x) => x.count));
            const tied = loads.filter((x) => x.count === minCount);
            const pick = tied[pr.number % tied.length].login;

            await github.rest.pulls.requestReviewers({
              owner,
              repo,
              pull_number: pr.number,
              reviewers: [pick],
            });

            core.info(`Requested reviewer ${pick} for PR #${pr.number} (sensitive=${isDatabaseOrSecurity}, minLoad=${minCount})`);
