name: Linked issue check
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const lower = (s) => s.toLowerCase();
            const repoInfo = await github.rest.repos.get({ owner, repo });
            const res = await github.rest.repos.getContent({
              owner, repo, path: '.github/maintainers.json', ref: repoInfo.data.default_branch
            });
            const cfg = JSON.parse(Buffer.from(res.data.content, 'base64').toString());
            const exempt = new Set([cfg.owner, ...cfg.core].map(lower));
            const query = `query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){pullRequest(number:$n){closingIssuesReferences(first:10){nodes{number state assignees(first:10){nodes{login}} labels(first:50){nodes{name}}}}}}}`;
            async function evaluate(pr) {
              const login = pr.user.login;
              let state = 'success';
              let desc = 'No linked issue needed for this author';
              if (pr.user.type !== 'Bot' && !exempt.has(lower(login))) {
                const data = await github.graphql(query, { o: owner, r: repo, n: pr.number });
                const issues = data.repository.pullRequest.closingIssuesReferences.nodes;
                if (issues.length === 0) {
                  state = 'failure';
                  desc = 'Link an approved issue with "Closes #N" in the description';
                } else {
                  const ok = issues.some((i) => i.state === 'OPEN'
                    && i.labels.nodes.some((l) => l.name === 'help wanted')
                    && i.assignees.nodes.some((a) => lower(a.login) === lower(login)));
                  if (ok) { desc = 'The linked issue is open for work and assigned to the author'; }
                  else { state = 'failure'; desc = 'The linked issue must have help wanted and be assigned to you'; }
                }
              }
              await github.rest.repos.createCommitStatus({
                owner, repo, sha: pr.head.sha, state, context: 'linked-issue', description: desc.slice(0, 140)
              });
            }
            if (context.eventName === 'workflow_dispatch') {
              const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', per_page: 100 });
              for (const pr of prs) { await evaluate(pr); }
            } else {
              await evaluate(context.payload.pull_request);
            }
