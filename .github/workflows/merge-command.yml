name: Merge command
on:
  issue_comment:
    types: [created]
permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  actions: write
concurrency:
  group: merge-command-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  merge:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '/merge')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const number = context.payload.issue.number;
            const commenter = context.payload.comment.user.login;
            const lower = (s) => s.toLowerCase();
            const say = (body) => github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            const res = await github.rest.repos.getContent({
              owner, repo, path: '.github/maintainers.json',
              ref: context.payload.repository.default_branch
            });
            const cfg = JSON.parse(Buffer.from(res.data.content, 'base64').toString());
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const assignees = pr.assignees.map((a) => lower(a.login));
            const isOwner = lower(commenter) === lower(cfg.owner);
            if (!isOwner && !assignees.includes(lower(commenter))) {
              const who = assignees.length ? assignees.map((a) => '@' + a).join(', ') : 'nobody yet';
              await say(`@${commenter} this one is assigned to ${who}, so they (or the owner) merge it. A review from you is very welcome though.`);
              return;
            }
            if (pr.state !== 'open' || pr.draft || pr.base.ref !== context.payload.repository.default_branch) {
              await say('This pull request is not in a state I can merge (closed, draft, or not targeting the main branch).');
              return;
            }
            if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
              await say('There are conflicts with main. Please merge main into the branch first.');
              return;
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: number, per_page: 100 });
            const latest = new Map();
            for (const r of reviews) {
              if (['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(r.state)) latest.set(lower(r.user.login), r);
            }
            if ([...latest.values()].some((r) => r.state === 'CHANGES_REQUESTED')) {
              await say('There is still a review asking for changes. Once that is resolved I can merge it.');
              return;
            }
            if (!isOwner) {
              const approved = assignees.some((a) => latest.get(a) && latest.get(a).state === 'APPROVED' && latest.get(a).commit_id === pr.head.sha);
              if (!approved) {
                await say('Please approve the latest commit first (a new commit removes the earlier approval), then comment /merge again.');
                return;
              }
            }
            const checks = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: pr.head.sha, per_page: 100 });
            const notReady = checks.filter((c) => c.status !== 'completed' || !['success', 'skipped', 'neutral'].includes(c.conclusion));
            if (notReady.length) {
              await say('Some checks are not green yet: ' + notReady.map((c) => c.name).join(', ') + '.');
              return;
            }
            const combined = await github.rest.repos.getCombinedStatusForRef({ owner, repo, ref: pr.head.sha });
            const badStatus = combined.data.statuses.filter((s) => ['failure', 'error'].includes(s.state));
            if (badStatus.length && !isOwner) {
              await say('Not yet: ' + badStatus.map((s) => `${s.context} (${s.description})`).join('; ') + '.');
              return;
            }
            const fresh = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (fresh.data.head.sha !== pr.head.sha) {
              await say('A new commit landed while I was checking. Comment /merge again once the checks are green.');
              return;
            }
            try {
              await github.rest.pulls.merge({
                owner, repo, pull_number: number, merge_method: 'squash',
                sha: pr.head.sha, commit_title: `${pr.title} (#${number})`
              });
              await github.rest.reactions.createForIssueComment({ owner, repo, comment_id: context.payload.comment.id, content: '+1' });
            } catch (e) {
              await say('I could not merge this: ' + e.message);
              return;
            }
            const CI_WORKFLOWS = ['ci.yml'];
            for (const wf of CI_WORKFLOWS) {
              try { await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: wf, ref: pr.base.ref }); }
              catch (e) { core.warning(String(e.message)); }
            }
