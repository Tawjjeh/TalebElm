name: Feature request
description: Propose new behavior, an endpoint, a refactor, or a test that adds coverage.
title: "[Feature]: "
labels:
  - "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        TalebElm is scoped to the six MVP milestones in `docs/business/ROADMAP.md`.
        A feature outside that scope waits in Discussions until the MVP closes.
        For an open product or technical question, start a thread in Discussions instead.
  - type: checkboxes
    id: searched
    attributes:
      label: Before filing
      options:
        - label: I searched open and closed issues and pull requests and found no duplicate.
          required: true
        - label: This is inside the MVP scope, or I explained below why it should wait.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing or painful today, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Routes, entities, and rules. Keep it specific enough to size the work.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: What is out of scope
      description: What this change deliberately does not do.
    validations:
      required: false
  - type: dropdown
    id: layer
    attributes:
      label: Main layer
      options:
        - Domain (entities, enums, exceptions, repository interfaces)
        - Application (services, DTOs, validators)
        - Infrastructure (EF Core, repositories, migrations)
        - Api (controllers, middleware, Program.cs)
        - Tests
        - Documentation or scripts
        - Cross-cutting
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Related rule or decision
      description: Optional. Quote the decision that the change follows or would change.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: checkboxes
    id: architecture
    attributes:
      label: Architecture
      options:
        - label: The proposal keeps business logic in Application and persistence in Infrastructure.
          required: true
