name: Documentation
description: Report a wrong rule, a stale status marker, a broken link, or a missing guide.
title: "[Docs]: "
labels:
  - "documentation"
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before filing
      options:
        - label: I searched open and closed issues and found no duplicate.
          required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: The file and heading or line where the problem is.
      placeholder: "docs/business/BUSINESS_RULES.md, rule C-7"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: Quote the current text and say why it is wrong. Name the code, test, or decision that disagrees.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Proposed text
      description: The replacement wording, the new link, or the missing section.
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - Wrong fact or stale Implemented/Target marker
        - Broken link or anchor
        - Missing guide or example
        - Table, diagram, or formatting error
        - Wording that changes no fact
    validations:
      required: true
  - type: checkboxes
    id: readiness
    attributes:
      label: Ready to claim
      options:
        - label: The change needs no product decision, only an accurate rewrite.
          required: true
