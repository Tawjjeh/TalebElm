name: Bug report
description: Report behavior that is wrong, a failing test, or a crash.
title: "[Bug]: "
labels:
  - "bug"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. One bug per issue, please.
        Do not include passwords, tokens, connection strings, or personal data.
        For a security problem, close this page and use the Security link instead.
  - type: checkboxes
    id: searched
    attributes:
      label: Before filing
      options:
        - label: I searched open and closed issues and found no duplicate.
          required: true
  - type: dropdown
    id: layer
    attributes:
      label: Affected layer
      description: Pick the layer where the problem starts, not where it shows up.
      options:
        - Domain (entities, enums, exceptions, repository interfaces)
        - Application (services, DTOs, validators)
        - Infrastructure (EF Core, repositories, migrations)
        - Api (controllers, middleware, Program.cs)
        - Tests (unit, integration, migration tests)
        - Documentation or scripts
        - Not sure
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit and environment
      description: The commit you tested and your .NET SDK version.
      placeholder: "b860556, .NET 10.0.x, Linux, SQLite"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: The observed behavior. Include the request, the response, or the failing test name.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What the rule, decision, or documented behavior says should happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `dotnet test --filter ...` or call `POST /api/...`
        2. Provide the payload
        3. Observe the result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or stack trace
      description: Paste text, not a screenshot. Redact anything private.
      render: text
    validations:
      required: false
  - type: input
    id: rule
    attributes:
      label: Related rule or decision
      description: Optional. For example `P-2`, `U-2`, or Decision 32.
    validations:
      required: false
  - type: checkboxes
    id: safe
    attributes:
      label: Sensitive data
      options:
        - label: This report contains no secrets, tokens, connection strings, or personal data.
          required: true
