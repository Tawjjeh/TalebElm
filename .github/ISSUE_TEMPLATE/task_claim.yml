name: Task Claim
description: Ask to take an open issue in TalebElm.
title: "[Task Claim]: <Issue Number> - <Issue Name>"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for offering to take this on.
        This form is a request, not an assignment. Comment on the issue itself with your plan, wait for a go-ahead reply, and only then start. `CONTRIBUTING.md` explains the whole process.
        Please check that nobody else is already assigned to the issue.
  - type: input
    id: task-number
    attributes:
      label: Issue Number
      placeholder: "#123"
    validations:
      required: true
  - type: input
    id: task-name
    attributes:
      label: Issue Name / Summary
      placeholder: "Implement Module unlock business rule"
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Target layer
      options:
        - Domain
        - Application
        - Infrastructure
        - Api
        - Tests
        - Documentation
        - Cross-cutting
    validations:
      required: true
  - type: textarea
    id: implementation-notes
    attributes:
      label: Proposed implementation approach (optional)
      description: Briefly describe how you plan to tackle this issue or any initial questions you have.
      placeholder: "I plan to add the validator in Application and test it with xUnit..."
  - type: checkboxes
    id: checklist
    attributes:
      label: Confirmation
      options:
        - label: I have read `CONTRIBUTING.md` and `ARCHITECTURE.md`.
          required: true
        - label: I understand that work starts only after a go-ahead reply and an assignment.
          required: true
        - label: I will keep my pull request focused, small (~200 lines target), and include tests.
          required: true
